[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "open-enhance"
version = "0.2.0"
requires-python = ">=3.12"
description = "Local evidence search and measured OpenCode enhancements"

[tool.hatch.build.targets.wheel]
packages = ["src/open_enhance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
